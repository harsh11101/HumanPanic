plugins {
    id 'java-library'
    id 'maven-publish'
}

// group and version come from gradle.properties (overridable with -Pgroup / -Pversion).

base {
    archivesName = 'HumanPanic'
}

java {
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

def springVersion = '6.2.12'
def aspectjVersion = '1.9.24'
def jacksonVersion = '2.17.1'

dependencies {
    // The core library has NO runtime dependencies.
    //
    // Optional Spring AOP integration (HumanPanicConfiguration, ConfigLoader, HumanPanicAspect).
    // Applications that use it already have these on their classpath; they are deliberately
    // not exported so that non-Spring consumers do not receive them.
    compileOnly "org.springframework:spring-context:${springVersion}"
    compileOnly "org.aspectj:aspectjweaver:${aspectjVersion}"

    // Only the annotations, so the model stays deserialisable by consumers who use Jackson.
    // Annotations that are absent at runtime are ignored by the JVM.
    compileOnly "com.fasterxml.jackson.core:jackson-annotations:${jacksonVersion}"

    testImplementation platform('org.junit:junit-bom:5.14.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.20.0'
    testImplementation "org.springframework:spring-context:${springVersion}"
    testImplementation "org.springframework:spring-test:${springVersion}"
    testImplementation "org.aspectj:aspectjweaver:${aspectjVersion}"
    testImplementation "org.springframework.boot:spring-boot:3.5.6"
    testImplementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Xlint:-options']
}

tasks.named('javadoc', Javadoc) {
    // io.pants.humanpanic.internal is not public API.
    exclude 'io/pants/humanpanic/internal/**'
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:all', '-quiet')
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // Tests write crash reports relative to the working directory; keep them inside build/.
    def testWorkDir = layout.buildDirectory.dir('test-work')
    workingDir = testWorkDir
    doFirst { testWorkDir.get().asFile.mkdirs() }
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes(
                'Implementation-Title': 'HumanPanic',
                'Implementation-Version': project.version,
                'Automatic-Module-Name': 'io.pants.humanpanic'
        )
    }
}

// Reproducible archives: no timestamps, stable entry order.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'HumanPanic'
            from components.java

            pom {
                name = 'HumanPanic'
                description = 'Human-friendly panic handler for Java applications, inspired by Rust\'s human-panic'
                url = 'https://github.com/harsh11101/HumanPanic'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }

                developers {
                    developer {
                        id = 'harsh11101'
                        name = 'Harsh Pant'
                        email = 'hiteshpant11101@gmail.com'
                    }
                }

                scm {
                    connection = 'scm:git:git://github.com/harsh11101/HumanPanic.git'
                    developerConnection = 'scm:git:ssh://github.com:harsh11101/HumanPanic.git'
                    url = 'https://github.com/harsh11101/HumanPanic/tree/main'
                }
            }
        }
    }
}
