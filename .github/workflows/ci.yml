name: CI

on:
  push:
    branches: ['**']   # not tags: the release job below pushes tags
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: JDK ${{ matrix.java }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [17, 21]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v6

      # Compile, run all tests, build javadoc and sources jars, then publish for the demo build.
      - name: Build and test the library
        # --no-build-cache: always execute the tests. Without it Gradle restores the previous
        # run's result from the cache whenever the library sources did not change.
        run: ./gradlew build :lib:publishToMavenLocal --no-build-cache

      - name: Report how many tests ran
        if: always()
        run: |
          total=0; failed=0; skipped=0
          for f in lib/build/test-results/test/TEST-*.xml; do
            [ -f "$f" ] || continue
            head=$(grep -m1 '<testsuite ' "$f")
            n() { echo "$head" | sed -n "s/.* $1=\"\([0-9]*\)\".*/\1/p"; }
            total=$((total + $(n tests)))
            failed=$((failed + $(n failures) + $(n errors)))
            skipped=$((skipped + $(n skipped)))
          done
          echo "Tests run: $total, failed: $failed, skipped: $skipped" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$total" -eq 0 ]; then
            echo "::error::No tests were executed"
            exit 1
          fi

      # The demo is a separate build that consumes the published jar like an external project.
      - name: Build the demo applications
        run: ./gradlew -p demo installDist

      - name: Smoke-test the demo CLIs
        run: |
          expect() {   # expect <exit status> <command...>
            local want=$1; shift
            local got=0
            "$@" || got=$?
            if [ "$got" -ne "$want" ]; then
              echo "::error::expected exit $want but got $got: $*"
              exit 1
            fi
          }
          expect 0  demo/cli-app/build/install/csvstat/bin/csvstat stats demo/data/sales.csv
          expect 1  demo/cli-app/build/install/csvstat/bin/csvstat stats demo/data/sales-corrupt.csv
          expect 2  demo/cli-app/build/install/csvstat/bin/csvstat import demo/data/sales-corrupt.csv
          expect 1  demo/picocli-app/build/install/salesctl/bin/salesctl total demo/data/sales-corrupt.csv
          expect 2  demo/picocli-app/build/install/salesctl/bin/salesctl total no-such-file.csv
          expect 1  demo/jcommander-app/build/install/salesavg/bin/salesavg demo/data/sales-corrupt.csv
          expect 70 demo/commons-cli-app/build/install/salesmax/bin/salesmax demo/data/sales-corrupt.csv
          expect 0  demo/spring-app/build/install/notify/bin/notify
          test -n "$(ls crash-reports/*.json)"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}-jdk${{ matrix.java }}
          path: lib/build/reports/tests/

  # Runs only after every build job has passed, and only for pushes to main.
  #   * tags the commit with the version from gradle.properties (once per version),
  #   * moves the "latest" tag to it,
  #   * asks JitPack to build that version and waits until it is downloadable.
  # To release a new version: change `version=` in gradle.properties and push to main.
  release:
    name: Tag and publish to JitPack
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push tags
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties | tr -d '[:space:]')
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::gradle.properties has no usable version (got '$version')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tag the version and move "latest"
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A version tag is created once and never moved: JitPack builds a tag a single time
          # and serves that build forever, so moving it would make the tag and the jar disagree.
          if [ -n "$(git ls-remote --tags origin "refs/tags/$VERSION")" ]; then
            echo "Tag $VERSION already exists; not moving it. Bump the version to release again."
          else
            git tag -a "$VERSION" -m "HumanPanic $VERSION"
            git push origin "refs/tags/$VERSION"
            echo "Created tag $VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          git tag -f latest
          git push -f origin refs/tags/latest
          echo "Moved tag latest to ${GITHUB_SHA::7}" | tee -a "$GITHUB_STEP_SUMMARY"

      # JitPack builds a version the first time somebody requests it. Requesting the POM here
      # means the first user does not have to wait, and a broken JitPack build fails this job.
      - name: Publish on JitPack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          base="https://jitpack.io/com/github/${GITHUB_REPOSITORY_OWNER}/${GITHUB_REPOSITORY#*/}/${VERSION}"
          pom="${base}/${GITHUB_REPOSITORY#*/}-${VERSION}.pom"
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 300 "$pom" || true)
            if [ "$status" = "200" ]; then
              echo "JitPack serves $VERSION: $pom" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $status, waiting for the JitPack build..."
            sleep 20
          done
          echo "::error::JitPack did not publish $VERSION. Build log follows."
          curl -s --max-time 60 "${base}/build.log" | tail -n 60 || true
          exit 1
